<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Registration Form</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
    }

    .container {
        width: 450px;
        margin: 30px auto;
        background: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    h2 {
        text-align: center;
        color: #333;
    }

    label {
        font-weight: bold;
    }

    input, select, textarea {
        width: 100%;
        padding: 10px;
        margin: 8px 0 15px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
    }

    textarea {
        resize: none;
    }

    button {
        width: 100%;
        padding: 10px;
        background: #007BFF;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #0056b3;
    }

    .error {
        color: red;
        font-size: 14px;
    }

    .success {
        color: green;
        text-align: center;
        font-size: 18px;
        margin-top: 15px;
    }
</style>

</head>
<body>
    <header>
<h1>Wedding Zone</h1>

<nav>
<a href="index.html">Home</a>
<a href="registration.html">Registration</a>
<a href="login.html">Login</a>
</nav>
</header>

<div class="container">

<h2>Event Registration Form</h2>

<form id="eventForm">

<label>Full Name</label>
<input type="text" id="name">
<div class="error" id="nameError"></div>

<label>Email</label>
<input type="email" id="email">
<div class="error" id="emailError"></div>

<label>Phone Number</label>
<input type="text" id="phone">
<div class="error" id="phoneError"></div>

<label>Age</label>
<input type="number" id="age">
<div class="error" id="ageError"></div>

<label>Gender</label>
<select id="gender">
    <option value="">Select Gender</option>
    <option>Male</option>
    <option>Female</option>
    <option>Other</option>
</select>
<div class="error" id="genderError"></div>

<label>Select Event</label>
<select id="event">
    <option value="">Choose Event</option>
    <option>Hackathon</option>
    <option>Workshop</option>
    <option>Seminar</option>
    <option>Coding Contest</option>
    <option>Cultural Fest</option>
</select>
<div class="error" id="eventError"></div>

<label>College Name</label>
<input type="text" id="college">
<div class="error" id="collegeError"></div>

<label>Comments</label>
<textarea id="comments" rows="4"></textarea>

<button type="submit">Register</button>

</form>

<div class="success" id="successMessage"></div>

</div>

<script>

document.getElementById("eventForm").addEventListener("submit", function(e){

e.preventDefault();

document.querySelectorAll(".error").forEach(error => error.innerHTML = "");
document.getElementById("successMessage").innerHTML = "";

let name = document.getElementById("name").value.trim();
let email = document.getElementById("email").value.trim();
let phone = document.getElementById("phone").value.trim();
let age = document.getElementById("age").value;
let gender = document.getElementById("gender").value;
let event = document.getElementById("event").value;
let college = document.getElementById("college").value.trim();

let valid = true;

// Name
if(name==""){
    document.getElementById("nameError").innerHTML="Name is required";
    valid=false;
}

// Email
let emailPattern=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
if(!emailPattern.test(email)){
    document.getElementById("emailError").innerHTML="Enter a valid email";
    valid=false;
}

// Phone
let phonePattern=/^[0-9]{10}$/;
if(!phonePattern.test(phone)){
    document.getElementById("phoneError").innerHTML="Phone number must contain 10 digits";
    valid=false;
}

// Age
if(age=="" || age<18){
    document.getElementById("ageError").innerHTML="Age must be 18 or above";
    valid=false;
}

// Gender
if(gender==""){
    document.getElementById("genderError").innerHTML="Please select gender";
    valid=false;
}

// Event
if(event==""){
    document.getElementById("eventError").innerHTML="Please select an event";
    valid=false;
}

// College
if(college==""){
    document.getElementById("collegeError").innerHTML="College name is required";
    valid=false;
}

if(valid){
    document.getElementById("successMessage").innerHTML =
    "🎉 Event Registration Successful!";
    document.getElementById("eventForm").reset();
}

});

</script>

</body>
</html>
